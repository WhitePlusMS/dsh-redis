<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Redis browsing and DSH conversation workflow</title>
  <desc id="desc">Manually connect Redis, select a DB and Key, inspect a row, then ask about the selection in the same DSH conversation. This is an explanatory diagram, not a captured interface.</desc>
  <rect width="1200" height="176" rx="14" fill="#101820"/>
  <!-- Four steps reflect the current manual connection and selection workflow. -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="39" font-weight="600" fill="#edf4f6">
    <text x="52" y="78">Connect</text><text x="52" y="126" fill="#24c7dd">Redis</text>
    <text x="354" y="78">Browse</text><text x="354" y="126" fill="#af8af1">DB / Key</text>
    <text x="656" y="78">Inspect</text><text x="656" y="126" fill="#f2a15c">a row</text>
    <text x="958" y="78">Ask</text><text x="958" y="126">DSH</text>
  </g>
  <g fill="none" stroke="#edf4f6" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 88h44m-10-10 10 10-10 10"/>
    <path d="M549 88h44m-10-10 10 10-10 10"/>
    <path d="M851 88h44m-10-10 10 10-10 10"/>
  </g>
</svg>
